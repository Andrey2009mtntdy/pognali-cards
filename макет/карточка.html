<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Макет карточки — Погнали РФ</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   ВСЕ РАЗМЕРЫ И ОТСТУПЫ — ЗДЕСЬ. Меняй числа, сохраняй файл (Ctrl+S),
   обновляй страницу в браузере (F5). Значения в пикселях карточки.
   ══════════════════════════════════════════════════════════════════════ */
:root {
  /* — размер карточки — */
  --card-w: 1086px;
  --card-h: 1448px;

  /* — цвет акцента — */
  --accent: #F26522;
  --accent-text: #F26522;
  --ink: #111111;
  --dim: #6b7280;

  /* — ЛОГОТИП сверху — */
  --logo-x: 100px;
  --logo-y: 10px;
  --logo-w: 887px;
  --logo-h: 239px;

  /* — БРЕНД (KUGOO) — */
  --brand-x: 46px;
  --brand-y: 253px;
  --brand-size: 88px;      /* высота букв */
  --brand-track:0px;      /* разрядка между буквами */

  /* — НАЗВАНИЕ (WISH 02 PRO) — */
  --model-x:22px;
  --model-y:330px;
  --model-w: 700px;
  --model-size: 236px;     /* кегль */
  --model-line:0.73;      /* межстрочный: меньше — строки ближе */
  --model-squeeze:0.76;   /* сжатие букв по ширине */

  /* — БЛОК БАТАРЕИ — */
  --batt-x:30px;
  --batt-y:699px;
  --batt-tile:110px;      /* размер оранжевой плитки */
  --batt-radius:25px;
  --batt-icon-pad:15px;   /* поле вокруг значка внутри плитки */
  --batt-text-x:120px;    /* отступ текста от левого края блока */
  --batt-type-y:10px;
  --batt-type-size:60px;  /* LI-ION */
  --batt-value-y:70px;
  --batt-value-size:50px; /* 60В / 27Ач */

  /* — ТРИ ПЛАШКИ ХАРАКТЕРИСТИК — */
  --spec-x:30px;
  --spec-y:840px;
  --spec-w: 340px;
  --spec-h: 111px;
  --spec-gap: 14px;
  --spec-radius: 26px;
  --spec-icon-x: 26px;
  --spec-icon-size: 73px;
  --spec-icon-scale: 1.3;  /* мотор и спидометр крупнее остальных */
  --spec-value-x: 125px;
  --spec-value-y: 16px;
  --spec-value-size: 52px;
  --spec-label-y: 72px;
  --spec-label-size: 20px;

  /* — ФОТО ТОВАРА — */
  --photo-x: 560px;
  --photo-y: 335px;
  --photo-w: 513px;
  --photo-h: 890px;

  /* — НИЖНЯЯ ЛЕНТА — */
  --foot-x: 42px;
  --foot-y: 1298px;
  --foot-w: 1001px;
  --foot-h: 128px;
  --foot-radius: 28px;
  --foot-icon-x: 28px;
  --foot-icon-size: 96px;
  --foot-text-x:130px;
  --foot-label-y: 30px;
  --foot-label-size:22px;
  --foot-value-y: 64px;
  --foot-value-size: 29px;
}

/* ── дальше служебное, обычно менять не нужно ─────────────────────── */
@font-face { font-family: 'Mont';   src: url('../шаблон/шрифты/Montserrat-ExtraBold.ttf'); }
@font-face { font-family: 'MontM';  src: url('../шаблон/шрифты/Montserrat-Medium.ttf'); }
@font-face { font-family: 'MontSB'; src: url('../шаблон/шрифты/Montserrat-SemiBold.ttf'); }
@font-face { font-family: 'Teko';   src: url('../шаблон/шрифты/Teko-Bold.woff2') format('woff2'); }
@font-face { font-family: 'Euro';   src: url('../шаблон/шрифты/Eurostile-BoldItalic.ttf'); }

body { margin: 0; background: #3a3d44; display: flex; justify-content: center; padding: 20px; }
.stage { transform-origin: top center; }

.card {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  overflow: hidden;
  background: #fff;
  font-family: 'MontM', sans-serif;
}
.card > * { position: absolute; }

.bg { left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }

.logo { left: var(--logo-x); top: var(--logo-y); width: var(--logo-w); height: var(--logo-h); object-fit: contain; }

.brand {
  left: var(--brand-x); top: var(--brand-y);
  font-family: 'Euro', sans-serif;
  font-size: var(--brand-size);
  letter-spacing: var(--brand-track);
  color: var(--ink);
  line-height: 1;
}

.model {
  left: var(--model-x); top: var(--model-y);
  width: calc(var(--model-w) / var(--model-squeeze));
  font-family: 'Teko', sans-serif;
  font-style: italic;
  font-size: var(--model-size);
  line-height: var(--model-line);
  color: var(--accent-text);
  transform: scaleX(var(--model-squeeze));
  transform-origin: left top;
  white-space: pre-line;
  /* при line-height меньше 1 первая строка уезжает вверх — компенсируем */
  padding-top: calc(var(--model-size) * (1 - var(--model-line)) / 2);
}

.batt { left: var(--batt-x); top: var(--batt-y); }
.batt-tile {
  position: absolute; left: 0; top: 8px;
  width: var(--batt-tile); height: var(--batt-tile);
  border-radius: var(--batt-radius);
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
}
.batt-tile svg { width: calc(var(--batt-tile) - var(--batt-icon-pad) * 2); height: auto; }
.batt-type {
  position: absolute; left: var(--batt-text-x); top: var(--batt-type-y);
  font-family: 'Euro', sans-serif; font-style: italic; font-size: var(--batt-type-size);
  color: var(--ink); line-height: 1; white-space: nowrap;
}
.batt-value {
  position: absolute; left: var(--batt-text-x); top: var(--batt-value-y);
  font-family: 'MontSB', sans-serif; font-style: italic; font-size: var(--batt-value-size);
  color: var(--accent-text); line-height: 1; white-space: nowrap;
}

.spec {
  left: var(--spec-x); width: var(--spec-w); height: var(--spec-h);
  border-radius: var(--spec-radius);
  background: #fff;
  border: 2.5px solid color-mix(in srgb, var(--accent) 75%, transparent);
  box-shadow: 0 8px 26px rgba(15,23,42,.13);
}
.spec-1 { top: var(--spec-y); }
.spec-2 { top: calc(var(--spec-y) + (var(--spec-h) + var(--spec-gap))); }
.spec-3 { top: calc(var(--spec-y) + (var(--spec-h) + var(--spec-gap)) * 2); }
.spec svg {
  position: absolute; left: var(--spec-icon-x); top: 50%;
  width: calc(var(--spec-icon-size) * var(--icon-k, 1));
  height: calc(var(--spec-icon-size) * var(--icon-k, 1));
  transform: translateY(-50%);
}
.spec .val {
  position: absolute; left: var(--spec-value-x); top: var(--spec-value-y);
  font-family: 'Mont', sans-serif; font-size: var(--spec-value-size);
  color: var(--ink); line-height: 1.05; white-space: nowrap;
}
.spec .val small { font-size: .58em; }
.spec .lbl {
  position: absolute; left: var(--spec-value-x); top: var(--spec-label-y);
  font-family: 'MontSB', sans-serif; font-size: var(--spec-label-size);
  letter-spacing: .7px; color: var(--dim); line-height: 1;
}

.photo {
  left: var(--photo-x); top: var(--photo-y);
  width: var(--photo-w); height: var(--photo-h);
  object-fit: contain;
}

.foot {
  left: var(--foot-x); top: var(--foot-y);
  width: var(--foot-w); height: var(--foot-h);
  border-radius: var(--foot-radius);
  background: #fff;
  border: 2.5px solid color-mix(in srgb, var(--accent) 90%, transparent);
  box-shadow: 0 8px 26px rgba(15,23,42,.13);
  display: flex;
}
.foot > div { flex: 1; position: relative; }
.foot > div + div::before {
  content: ''; position: absolute; left: 0; top: 22px; bottom: 22px;
  width: 1.5px; background: rgba(15,23,42,.09);
}
.foot svg {
  position: absolute; left: var(--foot-icon-x); top: 50%;
  width: var(--foot-icon-size); height: var(--foot-icon-size);
  transform: translateY(-50%);
}
.foot .lbl {
  position: absolute; left: var(--foot-text-x); top: var(--foot-label-y);
  font-family: 'Mont', sans-serif; font-size: var(--foot-label-size);
  letter-spacing: .5px; color: var(--accent-text); line-height: 1;
}
.foot .val {
  position: absolute; left: var(--foot-text-x); top: var(--foot-value-y);
  font-family: 'Mont', sans-serif; font-size: var(--foot-value-size);
  color: var(--ink); line-height: 1;
}

/* Панель масштаба — на саму карточку не влияет */
.zoom {
  position: fixed; right: 14px; top: 14px; z-index: 9;
  background: #1c1f26; color: #e8eaee; border: 1px solid #333;
  border-radius: 10px; padding: 10px 12px; font: 12px sans-serif;
}
.zoom input { width: 130px; vertical-align: middle; }
</style>
</head>

<div class="zoom">

<script>
  // Масштаб только для просмотра: карточка 1086×1448 целиком в экран не влезает.
  const z = document.getElementById('z');
  const stage = document.getElementById('stage');
  const zv = document.getElementById('zv');
  const apply = () => {
    stage.style.transform = 'scale(' + (z.value / 100) + ')';
    zv.textContent = z.value + '%';
  };
  z.addEventListener('input', apply);
  apply();
</script>
